<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>
<body>
<dialog id="intro-dialog">
    <p>
    <h2>This page is intended to play sounds. Please check your system's volume level</h2>


    <button id="intro-dialog-close">
        OK
    </button>
</dialog>


<header>
    <h1>Audio Instrument</h1>
</header>

<div class="app-container">
    <!-- PLAYER 1: WORKSPACE (Left Side) -->
    <aside class="panel player-panel" id="player1-panel">
        <h2>Mouse Controls</h2>

        <!-- Step 1: Add Note (Always Visible) -->
        <div class="control-group" id="step1-group">
            <button id="spawnBallBtn" class="action-btn">+ Add Note</button>
        </div>

        <!-- Step 2: Keyboard Controls (Revealed after clicking Add Note) -->
        <div class="p2-info-box revealable hidden" id="step2-group">
            <h3>Keyboard Controls</h3>
            <p><strong>arrow keys</strong> (Move Note)</p>
            <p><strong>Spacebar</strong> (Select Note)</p>
            <p><strong>Backspace</strong> (Delete Note)</p>
            <p class="status-line"><strong>Status:</strong> <span id="p2-status">No active note</span></p>
        </div>

        <!-- Step 3: Play/Pause Controls (Revealed after moving a note) -->
        <div class="control-group revealable hidden" id="step3-group">
            <button id="playPauseBtn" class="primary-btn">▶ Play</button>
        </div>

        <!-- Step 4: Waveform Selector (Revealed after pressing Play/Pause) -->
        <div class="control-group revealable hidden" id="step4-group">
            <label>Waveform</label>
            <div class="waveform-selector" id="waveSelector">
                <button type="button" class="wave-btn active" data-value="sine">Sine</button>
                <button type="button" class="wave-btn" data-value="square">Square</button>
                <button type="button" class="wave-btn" data-value="triangle">Triangle</button>
                <button type="button" class="wave-btn" data-value="sawtooth">Sawtooth</button>
            </div>
        </div>

        <!-- Step 5: Sliders (Revealed after selecting a waveform) -->
        <div class="sliders-container revealable hidden" id="step5-group">
            <div class="control-group vertical-group">
                <label for="speedSlider">Speed</label>
                <input type="range" id="speedSlider" min="40" max="240" value="120" class="vertical-range">
            </div>

            <div class="control-group vertical-group">
                <label for="volumeSlider">Volume</label>
                <input type="range" id="volumeSlider" min="-30" max="0" value="-6" step="1" class="vertical-range">
            </div>
        </div>
    </aside>

    <main class="panel stave-center" id="staveZone">
        <div id="playhead"></div>
    </main>
</div>

</body>
</html>
